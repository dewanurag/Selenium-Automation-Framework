name: Selenium Test Automation

on:
  schedule:
    - cron: '15 11 * * *'
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run automation framework
        run: mvn clean test -Dbrowser=chrome -DisHeadless=true

      - name: List files to verify report location
        if: always()
        run: |
          echo "=== project root ==="
          ls -la
          echo "=== test-output ==="
          ls -la test-output/ || echo "test-output not found"

      - name: Prepare report for GitHub Pages
        if: always()
        run: |
          mkdir -p pages-output
          cp report.html pages-output/index.html
          cp -r screenshots pages-output/screenshots 2>/dev/null || true

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-output/

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-logs
          path: logs/automation.log

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: screenshots/

      - name: Execution status
        if: always()
        run: echo 'Pipeline execution completed'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: always()

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
