name: Selenium Test Automation

on:
  schedule:
    - cron: '15 11 * * *'
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run automation framework
        run: mvn clean test -Dbrowser=chrome -DisHeadless=true

      - name: Find all HTML files
        if: always()
        run: find . -name "*.html" 2>/dev/null

      - name: Upload ExtentReport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ExtentReport
          path: report.html        # your actual report location

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-logs
          path: logs/automation.log

      - name: Execution status
        if: always()
        run: echo 'Pipeline execution completed'
